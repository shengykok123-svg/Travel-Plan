<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>西安九日行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* Organic tokens · travel-journal look. Single paper theme on purpose. */
:root{
  color-scheme:light;
  --ground:#f5ead8;--surface:#ebddc5;--paper:#f9f4ed;--ink:#201e1d;
  --n2:#eee7db;--n5:#a19786;--n6:#82796a;--mute:#645c50;--mute2:#474238;
  --acc:#c67139;--acc-h:#b2622d;--acc7:#8c491a;--acc8:#643312;--acc1:#fff2eb;--acc2:#ffe1d0;--acc4:#f6a06b;
  --sage6:#728157;--sage7:#56633f;--sage8:#3d472b;--sage1:#f0fae1;--sage2:#e1eecc;--sage3:#ccdbb2;
  --div:rgba(32,30,29,.16);
  --sh-sm:0 1px 2px rgba(46,43,37,.14);--sh-md:0 3px 10px rgba(46,43,37,.16);--sh-lg:0 12px 32px rgba(46,43,37,.22);
  --disp:'Caprasimo','Noto Serif SC',serif;
  --body:'Figtree','Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --hl:linear-gradient(transparent 58%,rgba(246,160,107,.5) 58%,rgba(246,160,107,.5) 92%,transparent 92%);
  --lined:repeating-linear-gradient(0deg,transparent 0 31px,rgba(32,30,29,.07) 31px 32px);
  --holes:radial-gradient(circle at 8px 8px,#e3d5bd 5.5px,transparent 6px) 0 0/16px 46px repeat-y;
  --washed:saturate(.6) contrast(.85) brightness(1.1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--acc7);text-underline-offset:3px}a:hover{color:var(--acc8)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::selection{background:rgba(198,113,57,.3)}
@keyframes tpDraw{to{stroke-dashoffset:0}}
@keyframes tpStamp{0%{opacity:0;transform:scale(1.8) rotate(-4deg)}70%{opacity:1;transform:scale(.94) rotate(-13deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes tpPulse{50%{opacity:.25;transform:scale(1.6)}}
@keyframes tpUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.disp{font-family:var(--disp);font-weight:700;font-synthesis:none}
.hl{background:var(--hl);padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nw{white-space:nowrap}
.tab-num{font-variant-numeric:tabular-nums}
.tape{position:absolute;width:92px;height:24px;border-radius:3px;pointer-events:none;z-index:2}
.tape.sage{background:rgba(143,160,115,.55)}.tape.terra{background:rgba(246,160,107,.5)}
.dotbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(32,30,29,.14) 1px,transparent 1.3px);background-size:22px 22px}
.shell{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 90px}
.page-root{position:relative;min-height:100vh;overflow-x:clip}

/* header + hero */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0 4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:50%;border:2px dashed var(--acc);color:var(--acc7);display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;transform:rotate(-8deg)}
.brand-t{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:17px;white-space:nowrap}
.save{font-size:12px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--n5)}
.save[data-s="ok"] i{background:var(--sage6)}.save[data-s="saving"] i{background:var(--acc4)}.save[data-s="err"] i,.save[data-s="readonly"] i{background:var(--acc-h)}
.hero{display:flex;flex-wrap:wrap;gap:44px;align-items:center;padding:30px 0 48px}
.hero-l{flex:1 1 440px;min-width:0}
.pill-date{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;white-space:nowrap;background:var(--sage2);color:var(--sage8);font-size:12px;font-weight:600}
.hero h1{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(46px,7.6vw,84px);line-height:1.04;letter-spacing:-.01em;margin:18px 0 14px}
.hero-sub{margin:0 0 28px;color:var(--mute);max-width:560px;text-wrap:pretty}
.route{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 4px}
.stop-wrap{display:flex;align-items:flex-start;gap:4px}
.stop-link{width:18px;margin-top:29px;border-top:2px dotted var(--n5)}
.stop{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;transition:transform .2s}
.stop:hover{transform:translateY(-4px)}
.stamp{width:60px;height:60px;border-radius:50%;border:2px dashed var(--c);display:grid;place-items:center;background:var(--paper);font-family:'Caprasimo',serif;font-size:14px;color:var(--c);transform:rotate(var(--tilt))}
.stop b{font-size:13px;font-weight:600;line-height:1.1;white-space:nowrap}
.stop small{font-size:11px;color:var(--mute);line-height:1;white-space:nowrap}
.hero-r{flex:0 1 420px;min-width:280px;position:relative;margin:0 auto;padding:10px 0 40px}
.pola{position:absolute;background:var(--paper);border-radius:14px;padding:8px 8px 26px;box-shadow:0 3px 10px rgba(46,43,37,.18);z-index:0}
.pola span{display:block;border-radius:8px;background-size:cover;background-position:center;filter:var(--washed)}
.pola div{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mute)}
.pola.a{left:-26px;bottom:-6px;width:150px;transform:rotate(-9deg)}.pola.a span{height:120px}
.pola.b{right:-18px;bottom:-22px;width:136px;transform:rotate(7deg)}.pola.b span{height:104px}
.postcard{position:relative;z-index:1;background:var(--paper);border-radius:30px;padding:30px 26px 22px;box-shadow:var(--sh-lg);transform:rotate(2deg);transition:transform .35s}
.postcard:hover{transform:rotate(0) scale(1.01)}
.postmark{position:absolute;right:-20px;top:-26px;width:96px;height:96px;border-radius:50%;border:2.5px solid rgba(140,73,26,.75);display:grid;place-items:center;transform:rotate(-14deg);background:rgba(249,244,237,.6)}
.postmark div{width:78px;height:78px;border-radius:50%;border:1.5px dashed rgba(140,73,26,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc7);line-height:1.1}
.postmark b{font-family:'Caprasimo',serif;font-size:15px;font-weight:400}
.postmark span{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.08em}
.cd-big{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.cd-big b{font-family:'Caprasimo',serif;font-weight:400;font-size:96px;line-height:.95;color:var(--acc)}
.cd-big span{font-size:18px;font-weight:600}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.pc-grid small{display:block;font-size:11px;color:var(--mute)}.pc-grid b{font-weight:700}
.dash{border-top:2px dashed rgba(32,30,29,.14);margin:18px 0 14px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -20px 30px;padding:0 20px;background:rgba(245,234,216,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tab{flex:none;border:1px solid rgba(32,30,29,.12);background:var(--paper);color:var(--ink);border-radius:999px;white-space:nowrap;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--acc)}
.tab[aria-selected="true"]{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.page{animation:tpUp .35s ease}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:22px}
.ph-no{font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.16em;color:var(--sage7)}
.ph h2{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(28px,4vw,38px);line-height:1.2;margin:4px 0 0;text-wrap:balance}
.ph.sm h2{font-size:clamp(26px,3.6vw,34px)}
.ph-note{font-size:13px;color:var(--mute);padding-bottom:6px;flex:1 1 260px;text-wrap:pretty}

/* generic chips / pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--div);background:var(--paper);color:var(--ink);border-radius:999px;white-space:nowrap;padding:6px 14px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#f5ead8;border-color:var(--ink)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.lk{font-size:12px;border-radius:999px;white-space:nowrap;padding:3px 11px;text-decoration:none}
.lk.x{background:var(--acc2);color:var(--acc8)}.lk.g{background:var(--surface);color:var(--mute2)}.lk.d{background:var(--sage2);color:var(--sage8)}
.lk:hover{filter:brightness(.96)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;background:var(--acc);color:var(--paper);border-radius:999px;white-space:nowrap;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--acc-h)}
.btn.ghost{border:1px solid rgba(32,30,29,.2);background:transparent;color:var(--ink);font-weight:400}
.btn.ghost:hover{background:var(--surface)}
.stampmark{position:absolute;border:2.5px solid var(--sage7);color:var(--sage7);background:rgba(240,250,225,.92);border-radius:12px;padding:3px 10px;font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:15px;white-space:nowrap;transform:rotate(-12deg);animation:tpStamp .4s ease-out;pointer-events:none;z-index:3}
.stampmark.terra{border-color:var(--acc7);color:var(--acc7);background:rgba(249,244,237,.7);letter-spacing:.08em}
.sticky-note{position:relative;background:var(--sage2);border-radius:22px;padding:22px 20px;transform:rotate(-1.2deg);box-shadow:0 3px 10px rgba(46,43,37,.14)}
.sticky-note p{margin:0;font-size:14px;color:var(--sage8);text-wrap:pretty}
.notebook{position:relative;background-color:var(--paper);background-image:var(--lined);border-radius:30px;box-shadow:0 3px 10px rgba(46,43,37,.14)}
.holes{position:absolute;left:16px;top:24px;bottom:24px;width:16px;background:var(--holes);pointer-events:none}

/* P.01 overview */
.ov-hotels{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin:-8px 0 22px}
.ov-hotels span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:34px 26px;padding-top:8px}
.ov-card{position:relative;text-align:left;border:0;cursor:pointer;background:var(--paper);border-radius:28px;padding:24px 22px 18px;box-shadow:var(--sh-md);transform:rotate(var(--tilt));transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:10px}
.ov-card:hover{transform:rotate(0) translateY(-6px);box-shadow:var(--sh-lg)}
.ov-card .tp{position:absolute;top:-11px;left:28px;width:84px;height:22px;border-radius:3px;background:var(--c);opacity:.5;transform:rotate(-3deg)}
.ov-date{position:absolute;right:16px;top:16px;width:46px;height:54px;border-radius:8px;border:2px dashed var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transform:rotate(4deg)}
.ov-date b{font-family:'Caprasimo',serif;font-weight:400;font-size:17px}.ov-date small{font-size:10px;color:var(--mute)}
.ov-day{font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.14em;color:var(--acc7)}
.ov-title{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:21px;line-height:1.25;text-wrap:balance;padding-right:56px}
.cpills{display:flex;flex-wrap:wrap;gap:6px}
.cpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--surface)}
.ov-hl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute2)}
.ov-hl div{display:flex;gap:8px}.ov-hl span:first-child{color:var(--mute);font-variant-numeric:tabular-nums;width:40px;flex:none}
.ov-hl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed rgba(32,30,29,.12);padding-top:10px;margin-top:auto;font-size:13px}
.ov-foot b{font-weight:700}.ov-foot span:last-child{font-weight:700;color:var(--acc7);white-space:nowrap}

/* P.02 itinerary */
.daychips{display:flex;gap:12px;overflow-x:auto;padding:14px 4px;margin:0 -4px 12px;scrollbar-width:thin}
.dchip{position:relative;flex:none;min-width:108px;text-align:left;border:0;background:var(--paper);color:var(--ink);border-radius:20px;padding:12px 14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh-sm);transform:rotate(var(--tilt));transition:all .25s}
.dchip:hover{transform:rotate(0) translateY(-3px)}
.dchip[aria-pressed="true"]{background:var(--ink);color:#f5ead8;box-shadow:0 12px 32px rgba(46,43,37,.25);transform:none}
.dchip .tp{position:absolute;top:-8px;left:50%;margin-left:-22px;width:44px;height:16px;border-radius:2px;background:var(--c);opacity:.55;transform:rotate(-4deg)}
.dchip small{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.14em;opacity:.8}
.dchip b{font-family:'Caprasimo',serif;font-weight:400;font-size:22px;line-height:1.1}
.dchip .dots{display:flex;gap:4px;margin-top:2px}
.it-wrap{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start}
.nb-page{flex:1 1 560px;min-width:0;border-radius:34px;padding:30px 26px 30px 54px}
.nb-page .holes{top:26px;bottom:26px}
.day-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.day-top .eyebrow{font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.14em;color:var(--acc7)}
.day-top h2{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:6px 0 10px}
.day-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.day-meta b{color:var(--ink)}
.day-nav{display:flex;gap:8px;flex:none}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--div);background:var(--ground);cursor:pointer;font-size:18px}
.rbtn:hover{background:var(--surface)}
.rbtn.go{border:0;background:var(--acc);color:var(--paper)}.rbtn.go:hover{background:var(--acc-h)}
.rbtn:disabled{opacity:.35;cursor:default}
.ev{display:grid;grid-template-columns:50px 18px minmax(0,1fr);column-gap:10px;--kc:var(--n6)}
.ev-time{text-align:right;padding-top:16px}
.ev-time b{display:block;font-family:'Caprasimo',serif;font-weight:400;font-size:17px;line-height:1;font-variant-numeric:tabular-nums;transition:color .3s}
.ev-time small{display:block;font-size:10px;color:var(--mute);margin-top:3px}
.ev-rail{position:relative;display:flex;justify-content:center}
.ev-rail::before{content:"";position:absolute;top:0;bottom:0;border-left:2px dashed var(--div)}
.ev-dot{position:relative;margin-top:16px;width:16px;height:16px;border-radius:50%;border:3px solid var(--kc);background:var(--paper);transition:background .3s,transform .3s}
.ev-body{padding:4px 0 12px;min-width:0}
.ev-card{position:relative;background:rgba(249,244,237,.9);border-radius:22px;padding:14px 16px;box-shadow:0 1px 2px rgba(46,43,37,.12);transition:background .3s,box-shadow .3s,transform .3s}
.ev.active .ev-time b{color:var(--acc7)}
.ev.active .ev-dot{background:var(--kc);transform:scale(1.25)}
.ev.active .ev-card{background:var(--acc1);box-shadow:0 12px 32px rgba(46,43,37,.18);transform:rotate(-.4deg)}
.ev-title span{transition:background .4s;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ev.active .ev-title span{background:linear-gradient(transparent 55%,rgba(246,160,107,.5) 55%,rgba(246,160,107,.5) 92%,transparent 92%)}
.ev.now .ev-card{outline:2px solid var(--sage6);outline-offset:-2px}
.ev-row{display:flex;gap:12px;align-items:flex-start}
.ev-main{flex:1;min-width:0}
.ev-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.kpill{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--kc);border:1.5px solid var(--kc);border-radius:999px;white-space:nowrap;padding:0 8px}
.tag-book{font-size:11px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--acc2);color:var(--acc8)}
.tag-done{font-size:11px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--sage2);color:var(--sage8)}
.tag-now{font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--sage7);color:var(--paper)}
.ev-title{font-weight:600;font-size:16px;line-height:1.45;text-wrap:pretty}
.ev-place{border:0;background:none;padding:0;margin-top:3px;cursor:pointer;font-size:13px;color:var(--mute);text-align:left}
.ev-place:hover{color:var(--acc7)}
.ev-thumb{position:relative;flex:none;width:70px;padding:5px 5px 14px;border:0;border-radius:10px;background:var(--acc1);cursor:zoom-in;box-shadow:var(--sh-md);transform:rotate(5deg);transition:transform .25s}
.ev-thumb:hover{transform:rotate(0) scale(1.08)}
.ev-thumb i{position:absolute;top:-6px;left:50%;margin-left:-16px;width:32px;height:11px;border-radius:2px;background:rgba(143,160,115,.6);transform:rotate(-6deg)}
.ev-thumb span{display:block;width:60px;height:56px;border-radius:6px;background-size:cover;background-position:center;filter:var(--washed)}
.ev-cost{flex:none;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-cost small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.ev-note{margin:8px 0 0;font-size:13px;color:var(--mute2);text-wrap:pretty}
.ev-book{margin:6px 0 0;font-size:12px;color:var(--acc7)}
.ev-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ev-acts .sp{flex:1}
.swapbtn{border:1.5px dashed var(--acc);background:transparent;color:var(--acc7);border-radius:999px;white-space:nowrap;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer}
.swapbtn[aria-expanded="true"]{background:var(--acc2)}
.mini-btn{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;padding:3px 8px;border-radius:999px;white-space:nowrap}
.mini-btn:hover{background:var(--surface)}
.mini-btn.armed{background:var(--acc2);color:var(--acc8)}
.optmini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:14px;animation:tpUp .25s ease}
.optmini{position:relative;text-align:left;border:0;outline:3px solid transparent;outline-offset:-3px;background:var(--acc1);border-radius:16px;padding:7px 7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 10px rgba(46,43,37,.14);transform:rotate(var(--tilt));transition:transform .2s}
.optmini:hover{transform:rotate(0) translateY(-3px)}
.optmini.sel{outline-color:var(--sage6)}
.optmini .ph-img{display:block;width:100%;height:86px;border-radius:10px;background-size:cover;background-position:center;filter:var(--washed)}
.optmini .ph-none{height:86px;border-radius:10px;border:2px dashed rgba(32,30,29,.18)}
.optmini b{font-weight:700;font-size:13px;padding:0 4px}
.optmini small{font-size:12px;color:var(--mute);padding:0 4px}

/* P.05 food */

.slot-h small{font-size:13px;color:var(--mute2)}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}

.thumbs{display:flex;gap:4px;border-radius:16px;overflow:hidden;height:110px}

.front{background:var(--paper);padding:12px 12px 0}

.hcard .sb{border:0;cursor:pointer}.hcard .sb:hover{background:var(--acc2)}.hcard.sel .sb:hover{background:var(--sage6)}.hcard .links{margin-top:10px}.hcard .ar span{color:var(--mute);font-weight:400}

const nowTs=()=>S.sim!=null?S.sim:Date.now();

/* ---------- map ---------- */
const MX=ln=>(ln-MAP_ORIGIN[0])*COS*1000,MY=la=>(MAP_ORIGIN[1]-la)*1000;
function mapPoints(scope){
  let pts=[],route=[];
  if(scope==='all'){const seen={};trip.days.forEach(d=>d.items.forEach(i=>{const p=place(i.place);if(p&&!seen[p.id]){seen[p.id]=1;pts.push({...p,label:''})}}))}
  else{let last=null;sortI(trip.days[scope].items).forEach(i=>{const p=place(i.place);if(!p||p.id===last)return;last=p.id;route.push(p)});const m=new Map();route.forEach((p,k)=>{if(!m.has(p.id))m.set(p.id,{...p,nums:[]});m.get(p.id).nums.push(k+1)});pts=[...m.values()].map(p=>({...p,label:p.nums.length>2?p.nums[0]+'…':p.nums.join(',')}))}
  return {pts,route};
}
function fitVB(xy){if(!xy.length)return {x:0,y:0,w:1400,h:700};const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const w=Math.max(x1-x0,10),h=Math.max(y1-y0,10),pd=Math.max(w,h)*.22+12;return {x:(x0+x1)/2-w/2-pd,y:(y0+y1)/2-h/2-pd,w:w+pd*2,h:h+pd*2}}
function mapSVG(key,scope){
  const {pts,route}=mapPoints(scope);const vk=key+'|'+scope;
  const vb=S.views[vk]||fitVB(pts.map(p=>[MX(p.ln),MY(p.la)]));
  const r=Math.max(vb.w,vb.h)*.017;
  const poly=a=>'M'+a.map(p=>MX(p[0]).toFixed(1)+','+MY(p[1]).toFixed(1)).join('L');
  let len=0;for(let k=1;k<route.length;k++)len+=Math.hypot(MX(route[k].ln)-MX(route[k-1].ln),MY(route[k].la)-MY(route[k-1].la));
  const rd=route.length>1?'M'+route.map(p=>MX(p.ln).toFixed(1)+','+MY(p.la).toFixed(1)).join('L'):'';
  let s=`<rect x="-3000" y="-3000" width="8000" height="8000" fill="#efe3cc"/>`;
  GEO.hills.forEach(g=>{s+=`<ellipse cx="${MX(g.ln)}" cy="${MY(g.la)}" rx="${(g.r*COS*1000*1.6).toFixed(1)}" ry="${(g.r*1000).toFixed(1)}" fill="#e4d6b8" opacity=".8"/>`;s+=`<text x="${MX(g.ln)}" y="${MY(g.la)+r*.8}" font-size="${(r*1.3).toFixed(1)}" fill="rgba(86,99,63,.55)" font-family="'Noto Serif SC',serif" font-weight="700" text-anchor="middle">${g.n}</text>`});
  GEO.rivers.forEach(rv=>{s+=`<path d="${poly(rv.pts)}" fill="none" stroke="#c9d8cf" stroke-width="${(r*rv.w).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`});
  GEO.walls.forEach(w=>{s+=`<path d="${poly(w)}Z" fill="rgba(198,113,57,.08)" stroke="#b08628" stroke-width="${(r*.22).toFixed(2)}" stroke-dasharray="${(r*.6).toFixed(2)} ${(r*.3).toFixed(2)}"/>`});
  GEO.labels.forEach(l=>{s+=`<text x="${MX(l[1])}" y="${MY(l[2])}" font-size="${(r*1.6).toFixed(1)}" fill="rgba(32,30,29,.32)" font-family="'Noto Serif SC',serif" font-weight="700" text-anchor="middle">${l[0]}</text>`});
  if(rd){s+=`<path d="${rd}" fill="none" stroke="#201e1d" stroke-width="${(r*.26).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:${len.toFixed(1)};stroke-dashoffset:${len.toFixed(1)};animation:tpDraw 1.8s cubic-bezier(.4,.1,.3,1) forwards"/>`;
    s+=`<circle r="${(r*.5).toFixed(2)}" fill="#c67139" stroke="#f9f4ed" stroke-width="${(r*.15).toFixed(2)}"><animateMotion dur="${Math.max(5,route.length*.9)}s" repeatCount="indefinite" path="${rd}"/></circle>`}
  pts.forEach(p=>{const sel=S.pick===p.id,rr=r*(sel?1.35:1)*(scope==='all'?.7:1),x=MX(p.ln),y=MY(p.la);
    s+=`<g class="mk" data-pid="${esc(p.id)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><title>${esc(p.n)}</title>`;
    if(sel)s+=`<circle r="${(rr*1.6).toFixed(2)}" fill="rgba(198,113,57,.25)"/>`;
    s+=`<circle r="${rr.toFixed(2)}" fill="${p.hotel?'#201e1d':(CC[p.c]||'#645c50')}" stroke="#f9f4ed" stroke-width="${(rr*.22).toFixed(2)}"/>`;
    if(p.label)s+=`<text font-size="${(rr*(p.label.length>2?.8:1.05)).toFixed(2)}" fill="#f9f4ed" font-weight="700" text-anchor="middle" dy=".35em" font-family="Figtree,sans-serif">${esc(p.label)}</text>`;
    if(scope!=='all'||sel)s+=`<text y="${(rr*2.3).toFixed(2)}" font-size="${(r*.9).toFixed(2)}" fill="#201e1d" text-anchor="middle" font-weight="600" stroke="#f9f4ed" stroke-width="${(r*.3).toFixed(2)}" paint-order="stroke" font-family="'Noto Sans SC',sans-serif">${esc(short(p.n).slice(0,10))}</text>`;
    s+=`</g>`});
  return {svg:`<svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet">${s}</svg>`,vb};
}
function mapHTML(key,scope,height){const vk=key+'|'+scope;const {svg}=mapSVG(key,scope);
  return `<div class="map" data-map="${esc(vk)}" data-key="${key}" data-scope="${scope}" style="height:${height}">${svg}
    <div class="map-ctl"><button type="button" data-a="mzoom" data-f="${1/1.4}" aria-label="放大">+</button><button type="button" data-a="mzoom" data-f="1.4" aria-label="缩小">−</button><button type="button" data-a="mreset" aria-label="重置视图">⟲</button></div>
    <div class="map-cap">西安示意图 · 拖动 / 滚轮缩放</div></div>`}
function curVB(el){const v=el.querySelector('svg').getAttribute('viewBox').split(/\s+/).map(Number);return {x:v[0],y:v[1],w:v[2],h:v[3]}}
function redrawMap(el){const {svg}=mapSVG(el.dataset.key,el.dataset.scope==='all'?'all':+el.dataset.scope);el.querySelector('svg').outerHTML=svg}
function zoomMap(el,f,fx,fy){const vb=curVB(el);fx=fx==null?.5:fx;fy=fy==null?.5:fy;const nw=Math.min(3000,Math.max(8,vb.w*f)),nh=vb.h*nw/vb.w;S.views[el.dataset.map]={x:vb.x+(vb.w-nw)*fx,y:vb.y+(vb.h-nh)*fy,w:nw,h:nh};redrawMap(el)}
let mapDrag=null,mapMoved=false;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.map');if(!el||e.button||e.target.closest('.map-ctl'))return;const svg=el.querySelector('svg');const rc=svg.getBoundingClientRect(),vb=curVB(el);mapDrag={el,svg,vb,sx:e.clientX,sy:e.clientY,sc:Math.max(vb.w/rc.width,vb.h/rc.height)};mapMoved=false});
addEventListener('pointermove',e=>{if(!mapDrag)return;const dx=e.clientX-mapDrag.sx,dy=e.clientY-mapDrag.sy;if(Math.abs(dx)+Math.abs(dy)>4)mapMoved=true;if(!mapMoved)return;const v=mapDrag.vb,nv={x:v.x-dx*mapDrag.sc,y:v.y-dy*mapDrag.sc,w:v.w,h:v.h};mapDrag.svg.setAttribute('viewBox',`${nv.x} ${nv.y} ${nv.w} ${nv.h}`);S.views[mapDrag.el.dataset.map]=nv});
addEventListener('pointerup',()=>{mapDrag=null;setTimeout(()=>{mapMoved=false},0)});
document.addEventListener('wheel',e=>{const el=e.target.closest('.map');if(!el)return;e.preventDefault();const rc=el.getBoundingClientRect();zoomMap(el,e.deltaY>0?1.15:1/1.15,(e.clientX-rc.left)/rc.width,(e.clientY-rc.top)/rc.height)},{passive:false});

/* ---------- P.03 now ---------- */
function nowParts(){
  const t=nowTs(),tl=timeline();let ci=-1;tl.forEach((x,k)=>{if(x.ts<=t)ci=k});
  const ended=t>END+3600e3,cur=ci>=0&&!ended&&t>=START-3600e3?tl[ci]:null;
  const phase=ended?'旅程已经结束':t<START?'距离抵达西安':'旅途进行中 · 距离返程起飞';
  const cdt=t<START?START-t:Math.max(0,END-t);
  const boxes=[['天',Math.floor(cdt/864e5)],['时',Math.floor(cdt/36e5)%24],['分',Math.floor(cdt/6e4)%60],['秒',Math.floor(cdt/1e3)%60]];
  const fm=x=>{const p=place(x.i.place);return {when:dp(x.d.date).md+' '+fmtT(x.i.t),kind:KIND[x.i.kind],title:x.i.title,place:p?p.n:'',note:x.i.note}};
  const eta=ms=>{const m=Math.round(ms/6e4);if(m<1)return '马上';if(m<60)return m+' 分钟后';const h=Math.floor(m/60);if(h<24)return h+' 小时'+(m%60?' '+m%60+' 分':'')+'后';return Math.floor(h/24)+' 天后'};
  const next=tl.slice(ci+1,ci+7).map((x,k)=>({...fm(x),eta:eta(x.ts-t),first:k===0}));
  const clamp=Math.min(SHI,Math.max(SLO,t));
  return {t,phase,boxes,cur:cur?fm(cur):null,ended,next,clamp};
}
function nowDynamic(){const P=nowParts();
  return {
    cd:`<div class="eyebrow">${P.phase}</div><div class="sheets">${P.boxes.map(([l,v])=>`<div class="sheet"><div class="ring"><i></i><i></i></div><b>${pad(v)}</b><small>${l}</small></div>`).join('')}</div><div style="font-size:13px;color:var(--mute);margin-top:12px">北京时间 ${bj(P.t)}</div>`,
    lab:bj(P.clamp),
    days:trip.days.map((d,k)=>{const on=P.t>=TS(d.date,'00:00')&&P.t<TS(d.date,'24:00');return `<button type="button" data-a="simDay" data-v="${k}" aria-pressed="${on}">${dp(d.date).md}</button>`}).join(''),
    cur:`<div class="tape terra" style="top:-12px;left:50%;margin-left:-46px;transform:rotate(2deg)"></div><div class="live"><i></i>正在进行</div>`+(P.cur?`<div style="margin-top:12px"><div style="font-size:13px">${esc(P.cur.when)} · ${esc(P.cur.kind)}</div><div class="t">${esc(P.cur.title)}</div><div style="font-size:13px">${esc(P.cur.place)}</div>${P.cur.note?`<p style="margin:8px 0 0;font-size:13px">${esc(P.cur.note)}</p>`:''}</div>`:`<p style="margin:12px 0 0">${P.ended?'欢迎回家，记得把照片整理出来。':'旅程还没开始。拖动上面的时间条，可以预览旅途中任何一刻。'}</p>`),
    next:`<div class="eyebrow">接下来</div><div style="display:flex;flex-direction:column;margin-top:8px">${P.next.map(x=>`<div class="nx${x.first?' first':''}"><i></i><span class="w">${esc(x.when)}</span><span class="tt">${esc(x.title)}</span><span class="e">${x.eta}</span></div>`).join('')||'<p class="ph-note">没有更多安排了。</p>'}</div>`,
    val:Math.round((P.clamp-SLO)/6e4)};
}

  return `<section class="page" style="display:flex;flex-direction:column;gap:30px">${ph('P.07','订票清单','点一下标记为已订，会盖上一个印章。酒店按你在「住宿」里选的那家计算。')}
    <div class="tk-sum"><div class="tape terra" style="top:-12px;right:40px;transform:rotate(6deg)"></div>
      <div class="ring"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="46" fill="none" stroke="#ccdbb2" stroke-width="12"/><circle cx="55" cy="55" r="46" fill="none" stroke="#c67139" stroke-width="12" stroke-linecap="round" stroke-dasharray="289" style="stroke-dashoffset:${(289*(1-pct/100)).toFixed(1)};transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.3,1)"/></svg><b>${pct}%</b></div>
      <div style="flex:1 1 240px"><div class="t">已订 ${done} / ${tk.length} 项</div><div class="s">越早订越省心，高铁和热门门票通常提前几天开售。</div></div></div>
    ${groups}</section>`}

/* ---------- P.08 budget ---------- */
// Rates are shown per 1 MYR; internally the budget still stores CNY→MYR and HKD/MOP→CNY.
const perMYR={CNY:()=>1/(+trip.settings.myr||.59),HKD:()=>perMYR.CNY()/(trip.settings.rates.HKD||.92),MOP:()=>perMYR.CNY()/(trip.settings.rates.MOP||.89)};
const SLIDERS=[
  {k:'people',l:'出行人数',min:1,max:10,step:1,dec:0,suf:'人',int:true,get:()=>trip.settings.people,set:(t,v)=>{t.settings.people=v;if(t.settings.rooms<Math.ceil(v/3))t.settings.rooms=Math.ceil(v/3)}},
  {k:'rooms',l:'酒店房间数',min:1,max:6,step:1,dec:0,suf:'间',int:true,get:()=>trip.settings.rooms,set:(t,v)=>{t.settings.rooms=v}},
  {k:'flight',l:'机票（每人来回）',min:0,max:3000,step:10,dec:0,pre:'RM',get:()=>trip.settings.flight,set:(t,v)=>{t.settings.flight=v}},
  {k:'misc',l:'杂费（每人，人民币）',min:0,max:3000,step:50,dec:0,pre:'¥',get:()=>trip.settings.misc,set:(t,v)=>{t.settings.misc=v}},
  {k:'rCNY',l:'1 马币 = ? 人民币',min:1.4,max:1.9,step:.005,dec:3,suf:'¥',rate:true,get:()=>perMYR.CNY(),set:(t,v)=>{t.settings.myr=1/v}}
];
const fmtS=(s,v)=>s.dec?(+v).toFixed(s.dec):String(Math.round(v));
function applySetting(k,raw){const s=SLIDERS.find(x=>x.k===k);if(!s)return;let v=+raw;
  if(!isFinite(v)||v<=0&&(s.rate||s.int)||v<0){toast('请输入有效的数字');render();return}
  if(s.int)v=Math.max(s.min,Math.round(v));
  commit(t=>s.set(t,v))}
function pBudget(){const B=calc(),myr=+trip.settings.myr||0,n=B.ppl;
  const cl=[['hotel','住宿','#3f7f86'],['food','餐饮','#c67139'],['ticket','门票 · 体验','#56633f'],['move','交通','#82796a'],['other','购物 · 其他','#4f6a8f'],['misc','杂费','#a8506e'],['flight','机票','#201e1d']];
  const pp=S.budView!=='all',div=pp?n:1;
  const mx=Math.max(1,...cl.map(c=>B.cat[c[0]]));
  const dayV=k=>(B.perDay[k].act+B.perDay[k].h)/div;const dm=Math.max(1,...trip.days.map((d,k)=>dayV(k)));
  const seg=`<div class="seg" role="group" aria-label="显示方式"><button type="button" data-a="budView" data-v="pp" aria-pressed="${pp}">每人</button><button type="button" data-a="budView" data-v="all" aria-pressed="${!pp}">${n} 人合计</button></div>`;
  return `<section class="page">${ph('P.08','预算','拖动左边的便签，右边的账单会立刻重新算。金额按人民币和马币同时显示。')}
    <div class="bud"><div class="sliders"><div class="tape terra" style="top:-12px;left:50%;margin-left:-46px;transform:rotate(-3deg)"></div>
      ${SLIDERS.map(s=>{const v=s.get();return `<div class="srow"><div class="lr"><label for="n-${s.k}">${s.l}</label><span class="numwrap">${s.pre?`<i>${s.pre}</i>`:''}<input type="number" class="num" id="n-${s.k}" data-n="${s.k}" value="${fmtS(s,v)}" min="${s.int?s.min:0}" step="${s.dec?'0.001':s.step}" inputmode="decimal">${s.suf?`<i>${s.suf}</i>`:''}</span></div><input type="range" data-s="${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}" aria-label="${s.l}"></div>`}).join('')}
      <p>汇率都以马币为准，可以直接在方框里输入，也可以拖动。杂费默认 ¥500/人，包含 eSIM 流量、手信和应急开销。机票按海南航空（海口转机）来回 RM 1,673/人计算，含23kg托运。</p></div>
    <div class="bud-r"><div class="receipt"><div class="rc-h">XI'AN TRIP · 预算账单</div>
      <div class="rc-tot"><div><small>每人</small><div class="big">RM ${n0(B.myr/n)}</div><div class="sub">¥${n0(B.cny/n)}</div></div>
        <div><small>${n} 人合计</small><div class="mid">RM ${n0(B.myr)}</div><div class="sub">¥${n0(B.cny)}</div></div>
        <div><small>建议带的人民币现金</small><div class="cash" style="margin-top:4px">¥500 左右 /人</div><div class="sub">大部分地方用支付宝、微信</div></div></div>
      <div class="cats-h"><span>${pp?'每人分类花费':n+' 人分类合计'}</span>${seg}</div>
      <div class="cats">${cl.map(([k,l,c])=>`<div class="cat"><span>${l}</span><div class="tr"><i style="width:${Math.round(B.cat[k]/mx*100)}%;--c:${c}"></i></div><span class="v">¥${n0(B.cat[k]/div)} · RM ${n0(B.cat[k]/div*myr)}</span></div>`).join('')}
        <div class="cat tot"><span>${pp?'每人合计':'全部合计'}</span><div></div><span class="v">¥${n0(B.cny/div)} · RM ${n0(B.myr/div)}</span></div></div></div>
      <div class="daybars"><div class="t">${pp?'每天每人':'每天 '+n+' 人合计'}花多少（¥，含住宿）· 点柱子看那天</div>
        <div class="bars">${trip.days.map((d,k)=>`<button type="button" data-a="openDay" data-v="${k}" title="${esc(d.title)}"><small>${n0(dayV(k))}</small><i style="height:${Math.max(3,Math.round(dayV(k)/dm*100))}%;--c:${CC[(d.cities||['xa'])[0]]}"></i><em>${dp(d.date).md}</em></button>`).join('')}</div></div></div></div></section>`}

/* ---------- P.09 settings ---------- */
function pSettings(){const synced=!!docRef;
  return `<section class="page">${ph('P.09','设置与备份',synced?'出发前确认一下这几件事。行程改动会同步给打开同一个 claude.ai 链接的同行者。':'出发前确认一下这几件事。行程改动只存在这台设备上，要分享给同行者就导出成文字。')}
    <div class="set"><div class="notebook nb"><div class="holes"></div><h3>待你确认的事</h3><ul>
      <li><b>4 人</b>住 <b>2 间双床房</b>，全程住钟楼附近。</li>
      <li>去程海南航空 <b>10/8 21:05</b> 吉隆坡起飞，00:40 到海口转机（约5小时50分），<b>10/9 09:30</b> 到西安咸阳 T3。中国的入境检查在海口办。</li>
      <li>回程 <b>10/17 09:05</b> 西安起飞，12:00 到海口转机（约4小时30分），<b>20:00</b> 回到吉隆坡。出境检查在海口办。当天 05:45 要从酒店出发。</li>
      <li>10/12 是周一，陕西历史博物馆周一闭馆，所以放在 10/14（周三）；华山放在平日的 10/13（周二），人比周末少。</li>
      <li>机票按每人来回 <b>RM ${n0(trip.settings.flight)}</b>（AirAsia X）计算。</li>
      <li>价格是 2026 年的大致估算，评分是各平台的大致水平。实际以订票页面和链接里的最新评价为准。</li></ul></div>
    <div class="backup"><div class="tape sage" style="top:-12px;left:36px;transform:rotate(-5deg)"></div><h3>备份与分享</h3>
      <p>把行程导出成一段文字保存或发给朋友；朋友也可以把别人给的文字贴进来导入。</p>
      <textarea id="json-box" spellcheck="false" aria-label="行程数据">${esc(S.json)}</textarea>
      <div class="acts"><button type="button" class="btn" data-a="export">导出当前行程</button><button type="button" class="btn ghost" data-a="copy">复制</button><button type="button" class="btn ghost" data-a="import">导入上面的内容</button><span style="flex:1"></span><button type="button" class="reset${S.resetArm?' armed':''}" data-a="reset">${S.resetArm?'再点一次确认恢复':'恢复默认行程'}</button></div></div></div></section>`}

/* ---------- overlays ---------- */
function toast(m){$('#toast-root').innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>{$('#toast-root').innerHTML=''},2000)}
function renderLb(){const L=S.lb;if(!L){$('#lb-root').innerHTML='';return}const im=L.imgs[L.i];
  $('#lb-root').innerHTML=`<div class="lb" data-a="lbClose" role="dialog" aria-modal="true" aria-label="照片"><button type="button" class="lb-btn lb-x" data-a="lbClose" aria-label="关闭">×</button><button type="button" class="lb-btn lb-prev" data-a="lbStep" data-v="-1" aria-label="上一张">‹</button>
    <figure data-stop="1"><img src="${esc(im.f)}" alt="${esc(L.title)}"><figcaption><b>${esc(L.title)}</b> · ${L.i+1} / ${L.imgs.length}<br>照片：${esc(im.a)} · ${esc(im.l)} · <a href="${esc(im.p)}" target="_blank" rel="noopener">Wikimedia Commons</a><br><small>${esc(L.note||'参考照片，展示这道菜或这个品牌的样子，不一定拍自这家店。')}</small></figcaption></figure>
    <button type="button" class="lb-btn lb-next" data-a="lbStep" data-v="1" aria-label="下一张">›</button></div>`}

/* ---------- render ---------- */
function render(){
  pending=false;
  for(const k in GREG)delete GREG[k];
  renderHero();
  const P={overview:pOverview,itinerary:pItinerary,now:pNow,map:pMap,food:pFood,hotels:pHotels,tickets:pTickets,budget:pBudget,settings:pSettings}[S.tab];
  $('#main').innerHTML=P();
  renderLb();
  if(S.tab==='itinerary')onScroll();
}
function setTab(id){S.tab=id;if(id!=='map'&&id!=='itinerary')S.pick=null;S.swap=null;S.edit=null;render();try{history.replaceState(null,'','#'+id)}catch(e){}}
function openDay(k){S.tab='itinerary';S.day=Math.max(0,Math.min(trip.days.length-1,k));S.edit=null;S.swap=null;S.pick=null;S.delArm=null;render();scrollTo({top:$('.tabs').offsetTop,behavior:'smooth'})}
function goDay(k){if(k<0||k>=trip.days.length)return;S.day=k;S.edit=null;S.swap=null;S.pick=null;S.delArm=null;S.active=null;render()}
function updPick(){const slot=$('#pick-slot');if(slot)slot.innerHTML=pickCard(S.tab==='map');document.querySelectorAll('.map').forEach(redrawMap)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(e.target.closest('[data-stop]')&&el.classList.contains('lb'))return;
  if(e.target.closest('a'))return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'tab':setTab(v);break;
    case 'openDay':openDay(+v);break;
    case 'goDay':goDay(+v);break;
    case 'pick':S.pick=v;updPick();break;
    case 'swap':S.swap=S.swap===el.dataset.id?null:el.dataset.id;S.edit=null;render();break;
    case 'choose':{const id=el.dataset.id,k=+el.dataset.k,it=trip.days.flatMap(d=>d.items).find(x=>x.id===id);if(it&&k!==curOpt(it))chooseMeal(id,k);break}
    case 'edit':S.edit=S.edit===el.dataset.id?null:el.dataset.id;S.swap=null;render();break;
    case 'cancelEdit':{const di=S.day,it=trip.days[di].items.find(x=>x.id===S.edit);S.edit=null;if(it&&it._new){commit(t=>{t.days[di].items=t.days[di].items.filter(x=>x.id!==it.id)})}else render();break}
    case 'del':{const id=el.dataset.id;if(S.delArm===id){S.delArm=null;commit(t=>{t.days[S.day].items=t.days[S.day].items.filter(x=>x.id!==id);delete t.bookings[id]},'已删除')}else{S.delArm=id;render();clearTimeout(pDel);pDel=setTimeout(()=>{if(S.delArm===id){S.delArm=null;render()}},2500)}break}
    case 'add':{const d=trip.days[S.day],s=sortI(d.items),last=s.length?s[s.length-1].t:'09:00';const [hh,mm]=last.split(':').map(Number);const n={id:'x'+Date.now().toString(36),t:pad(Math.min(27,hh+1))+':'+pad(mm||0),kind:'sight',title:'新的安排',place:'',cost:0,cur:CITY[(d.cities||['sz'])[0]].cur,per:'p',note:'',book:'',_new:true};S.edit=n.id;commit(t=>t.days[S.day].items.push(n));break}
    case 'lb':{const G=GREG[el.dataset.g];if(G){S.lb={imgs:G.imgs,title:G.title,note:G.note,i:+el.dataset.i||0};renderLb()}e.preventDefault();break}
    case 'lbClose':S.lb=null;renderLb();break;
    case 'lbStep':{const L=S.lb;if(L){L.i=(L.i+(+v)+L.imgs.length)%L.imgs.length;renderLb()}break}
    case 'simDay':{const d=trip.days[+v];{const f=sortI(d.items)[0];S.sim=TS(d.date,f?f.t:'09:00')}refreshNow();break}
    case 'simOff':S.sim=null;refreshNow();break;
    case 'mapDay':S.mapDay=v==='all'?'all':+v;render();break;
    case 'mzoom':zoomMap(el.closest('.map'),+el.dataset.f);break;
    case 'mreset':{const m=el.closest('.map');delete S.views[m.dataset.map];redrawMap(m);break}
    case 'foodDay':S.foodDay=v==='all'?'all':+v;render();break;
    case 'foodCity':S.foodCity=v;render();break;
    case 'budView':S.budView=v;render();break;
    case 'flip':el.classList.toggle('on');break;
    case 'toMap':e.stopPropagation();S.tab='map';S.mapDay='all';S.pick=v;render();scrollTo({top:$('.tabs').offsetTop,behavior:'smooth'});break;
    case 'hotel':{const c=el.dataset.c,h=el.dataset.v;if(trip.settings.hotel[c]!==h)commit(t=>{t.settings.hotel[c]=h},'已选 '+short(HOTELS[c].find(x=>x.id===h).n));break}
    case 'book':{const id=v,was=!!trip.bookings[id];commit(t=>{if(t.bookings[id])delete t.bookings[id];else t.bookings[id]=Date.now()},was?'已取消标记':'已标记为已订');break}
    case 'export':S.json=JSON.stringify(trip);$('#json-box').value=S.json;toast('已导出到文本框');break;
    case 'copy':{const b=$('#json-box');if(!b.value)b.value=JSON.stringify(trip);const fb=()=>{b.focus();b.select();toast('已选中，按 Ctrl+C 复制')};try{navigator.clipboard.writeText(b.value).then(()=>toast('已复制'),fb)}catch(err){fb()}break}
    case 'import':{try{const o=JSON.parse($('#json-box').value);if(!o||!Array.isArray(o.days))throw 0;const t=norm(o);S.day=0;commit(x=>{Object.assign(x,t)},'已导入')}catch(err){toast('内容格式不对，导入失败')}break}
    case 'reset':{if(S.resetArm){S.resetArm=false;const b=trip.bookings;commit(x=>{Object.assign(x,norm(clone(DEFAULT)));x.bookings=b},'已恢复默认行程（订票勾选保留）')}else{S.resetArm=true;render();setTimeout(()=>{if(S.resetArm){S.resetArm=false;if(S.tab==='settings')render()}},3000)}break}
  }
});
let pDel=null;
// the map uses click on markers, gated by the drag flag
document.addEventListener('click',e=>{const g=e.target.closest('.mk');if(!g||mapMoved)return;S.pick=g.dataset.pid;updPick();if(S.tab==='itinerary'){const ev=[...document.querySelectorAll('[data-ev]')].find(x=>{const it=trip.days[S.day].items.find(i=>i.id===x.dataset.ev);return it&&it.place===S.pick});if(ev)ev.scrollIntoView({block:'center',behavior:'smooth'})}});
document.addEventListener('submit',e=>{if(e.target.id!=='edit-form')return;e.preventDefault();const f=new FormData(e.target),id=e.target.dataset.id;
  const t=String(f.get('t')||'').trim(),title=String(f.get('title')||'').trim();if(!title)return;
  S.edit=null;commit(x=>{for(const d of x.days){const it=d.items.find(i=>i.id===id);if(!it)continue;Object.assign(it,{t:/^\d{2}:\d{2}$/.test(t)?t:it.t,kind:f.get('kind'),title,cost:Math.max(0,+f.get('cost')||0),cur:f.get('cur'),per:f.get('per'),note:String(f.get('note')||'').trim(),book:String(f.get('book')||'').trim()});delete it._new}},'已保存');
  if(pending)render()});
document.addEventListener('input',e=>{
  if(e.target.id==='sim-range'){S.sim=SLO+(+e.target.value)*6e4;refreshNow();return}
  const ds=e.target.dataset||{};
  if(ds.s){const s=SLIDERS.find(x=>x.k===ds.s),n=$('#n-'+ds.s);if(s&&n)n.value=fmtS(s,e.target.value)}
  else if(ds.n){const r=document.querySelector(`[data-s="${ds.n}"]`);if(r&&e.target.value!=='')r.value=e.target.value}
});
document.addEventListener('change',e=>{const ds=e.target.dataset||{};const k=ds.s||ds.n;if(!k)return;applySetting(k,e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.n){e.preventDefault();e.target.blur()}});
document.addEventListener('input',e=>{if(e.target.id==='json-box')S.json=e.target.value});
addEventListener('keydown',e=>{
  if(S.lb){if(e.key==='Escape'){S.lb=null;renderLb()}if(e.key==='ArrowRight'){S.lb.i=(S.lb.i+1)%S.lb.imgs.length;renderLb()}if(e.key==='ArrowLeft'){S.lb.i=(S.lb.i-1+S.lb.imgs.length)%S.lb.imgs.length;renderLb()}return}
  const tg=document.activeElement&&document.activeElement.tagName;
  if(S.tab==='itinerary'&&!S.edit&&!/INPUT|TEXTAREA|SELECT/.test(tg)){if(e.key==='ArrowRight')goDay(S.day+1);if(e.key==='ArrowLeft')goDay(S.day-1)}
});
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(!e.target.closest('#nb'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&!S.edit)goDay(S.day+(dx<0?1:-1))},{passive:true});
// scroll-linked highlight in the day notebook
let scRaf=0;
function onScroll(){if(S.tab!=='itinerary')return;cancelAnimationFrame(scRaf);scRaf=requestAnimationFrame(()=>{let best=null,bd=1e9;const mid=innerHeight*.42;document.querySelectorAll('[data-ev]').forEach(el=>{const r=el.getBoundingClientRect();const d=Math.abs(r.top+Math.min(r.height,120)/2-mid);if(d<bd){bd=d;best=el}});
  if(best&&best.dataset.ev!==S.active){S.active=best.dataset.ev;document.querySelectorAll('[data-ev].active').forEach(x=>x.classList.remove('active'));best.classList.add('active')}})}
addEventListener('scroll',onScroll,{passive:true});
// clocks: hero every 30 s, the 旅途中 page every second
setInterval(()=>{if(S.tab==='now')refreshNow()},1000);
setInterval(()=>{renderHero()},30000);

/* ---------- boot ---------- */
(function(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
  const t=Date.now();if(t>=START-3600e3&&t<=END+3600e3){const id=nowItemId();trip.days.forEach((d,k)=>{if(d.items.some(i=>i.id===id))S.day=k})}
  render()})();

</script>
