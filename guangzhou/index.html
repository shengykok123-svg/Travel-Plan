<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>广州八日行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* Organic tokens · travel-journal look. Single paper theme on purpose. */
:root{
  color-scheme:light;
  --ground:#f5ead8;--surface:#ebddc5;--paper:#f9f4ed;--ink:#201e1d;
  --n2:#eee7db;--n5:#a19786;--n6:#82796a;--mute:#645c50;--mute2:#474238;
  --acc:#c67139;--acc-h:#b2622d;--acc7:#8c491a;--acc8:#643312;--acc1:#fff2eb;--acc2:#ffe1d0;--acc4:#f6a06b;
  --sage6:#728157;--sage7:#56633f;--sage8:#3d472b;--sage1:#f0fae1;--sage2:#e1eecc;--sage3:#ccdbb2;
  --div:rgba(32,30,29,.16);
  --sh-sm:0 1px 2px rgba(46,43,37,.14);--sh-md:0 3px 10px rgba(46,43,37,.16);--sh-lg:0 12px 32px rgba(46,43,37,.22);
  --disp:'Caprasimo','Noto Serif SC',serif;
  --body:'Figtree','Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --hl:linear-gradient(transparent 58%,rgba(246,160,107,.5) 58%,rgba(246,160,107,.5) 92%,transparent 92%);
  --lined:repeating-linear-gradient(0deg,transparent 0 31px,rgba(32,30,29,.07) 31px 32px);
  --holes:radial-gradient(circle at 8px 8px,#e3d5bd 5.5px,transparent 6px) 0 0/16px 46px repeat-y;
  --washed:saturate(.6) contrast(.85) brightness(1.1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--acc7);text-underline-offset:3px}a:hover{color:var(--acc8)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=range]{accent-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::selection{background:rgba(198,113,57,.3)}
@keyframes tpDraw{to{stroke-dashoffset:0}}
@keyframes tpStamp{0%{opacity:0;transform:scale(1.8) rotate(-4deg)}70%{opacity:1;transform:scale(.94) rotate(-13deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes tpPulse{50%{opacity:.25;transform:scale(1.6)}}
@keyframes tpUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.disp{font-family:var(--disp);font-weight:700;font-synthesis:none}
.hl{background:var(--hl);padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nw{white-space:nowrap}
.tab-num{font-variant-numeric:tabular-nums}
.tape{position:absolute;width:92px;height:24px;border-radius:3px;pointer-events:none;z-index:2}
.tape.sage{background:rgba(143,160,115,.55)}.tape.terra{background:rgba(246,160,107,.5)}
.dotbg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(32,30,29,.14) 1px,transparent 1.3px);background-size:22px 22px}
.shell{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 90px}
.page-root{position:relative;min-height:100vh;overflow-x:clip}

/* header + hero */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 0 4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:50%;border:2px dashed var(--acc);color:var(--acc7);display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;transform:rotate(-8deg)}
.brand-t{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:17px;white-space:nowrap}
.save{font-size:12px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--n5)}
.save[data-s="ok"] i{background:var(--sage6)}.save[data-s="saving"] i{background:var(--acc4)}.save[data-s="err"] i,.save[data-s="readonly"] i{background:var(--acc-h)}
.hero{display:flex;flex-wrap:wrap;gap:44px;align-items:center;padding:30px 0 48px}
.hero-l{flex:1 1 440px;min-width:0}
.pill-date{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;white-space:nowrap;background:var(--sage2);color:var(--sage8);font-size:12px;font-weight:600}
.hero h1{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(46px,7.6vw,84px);line-height:1.04;letter-spacing:-.01em;margin:18px 0 14px}
.hero-sub{margin:0 0 28px;color:var(--mute);max-width:560px;text-wrap:pretty}
.route{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 4px}
.stop-wrap{display:flex;align-items:flex-start;gap:4px}
.stop-link{width:18px;margin-top:29px;border-top:2px dotted var(--n5)}
.stop{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;transition:transform .2s}
.stop:hover{transform:translateY(-4px)}
.stamp{width:60px;height:60px;border-radius:50%;border:2px dashed var(--c);display:grid;place-items:center;background:var(--paper);font-family:'Caprasimo',serif;font-size:14px;color:var(--c);transform:rotate(var(--tilt))}
.stop b{font-size:13px;font-weight:600;line-height:1.1;white-space:nowrap}
.stop small{font-size:11px;color:var(--mute);line-height:1;white-space:nowrap}
.hero-r{flex:0 1 420px;min-width:280px;position:relative;margin:0 auto;padding:10px 0 40px}
.pola{position:absolute;background:var(--paper);border-radius:14px;padding:8px 8px 26px;box-shadow:0 3px 10px rgba(46,43,37,.18);z-index:0}
.pola span{display:block;border-radius:8px;background-size:cover;background-position:center;filter:var(--washed)}
.pola div{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mute)}
.pola.a{left:-26px;bottom:-6px;width:150px;transform:rotate(-9deg)}.pola.a span{height:120px}
.pola.b{right:-18px;bottom:-22px;width:136px;transform:rotate(7deg)}.pola.b span{height:104px}
.postcard{position:relative;z-index:1;background:var(--paper);border-radius:30px;padding:30px 26px 22px;box-shadow:var(--sh-lg);transform:rotate(2deg);transition:transform .35s}
.postcard:hover{transform:rotate(0) scale(1.01)}
.postmark{position:absolute;right:-20px;top:-26px;width:96px;height:96px;border-radius:50%;border:2.5px solid rgba(140,73,26,.75);display:grid;place-items:center;transform:rotate(-14deg);background:rgba(249,244,237,.6)}
.postmark div{width:78px;height:78px;border-radius:50%;border:1.5px dashed rgba(140,73,26,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--acc7);line-height:1.1}
.postmark b{font-family:'Caprasimo',serif;font-size:15px;font-weight:400}
.postmark span{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.08em}
.cd-big{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.cd-big b{font-family:'Caprasimo',serif;font-weight:400;font-size:96px;line-height:.95;color:var(--acc)}
.cd-big span{font-size:18px;font-weight:600}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.pc-grid small{display:block;font-size:11px;color:var(--mute)}.pc-grid b{font-weight:700}
.dash{border-top:2px dashed rgba(32,30,29,.14);margin:18px 0 14px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -20px 30px;padding:0 20px;background:rgba(245,234,216,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tab{flex:none;border:1px solid rgba(32,30,29,.12);background:var(--paper);color:var(--ink);border-radius:999px;white-space:nowrap;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--acc)}
.tab[aria-selected="true"]{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.page{animation:tpUp .35s ease}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:22px}
.ph-no{font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.16em;color:var(--sage7)}
.ph h2{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(28px,4vw,38px);line-height:1.2;margin:4px 0 0;text-wrap:balance}
.ph.sm h2{font-size:clamp(26px,3.6vw,34px)}
.ph-note{font-size:13px;color:var(--mute);padding-bottom:6px;flex:1 1 260px;text-wrap:pretty}

/* generic chips / pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--div);background:var(--paper);color:var(--ink);border-radius:999px;white-space:nowrap;padding:6px 14px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#f5ead8;border-color:var(--ink)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.lk{font-size:12px;border-radius:999px;white-space:nowrap;padding:3px 11px;text-decoration:none}
.lk.x{background:var(--acc2);color:var(--acc8)}.lk.g{background:var(--surface);color:var(--mute2)}.lk.d{background:var(--sage2);color:var(--sage8)}
.lk:hover{filter:brightness(.96)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;background:var(--acc);color:var(--paper);border-radius:999px;white-space:nowrap;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--acc-h)}
.btn.ghost{border:1px solid rgba(32,30,29,.2);background:transparent;color:var(--ink);font-weight:400}
.btn.ghost:hover{background:var(--surface)}
.stampmark{position:absolute;border:2.5px solid var(--sage7);color:var(--sage7);background:rgba(240,250,225,.92);border-radius:12px;padding:3px 10px;font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:15px;white-space:nowrap;transform:rotate(-12deg);animation:tpStamp .4s ease-out;pointer-events:none;z-index:3}
.stampmark.terra{border-color:var(--acc7);color:var(--acc7);background:rgba(249,244,237,.7);letter-spacing:.08em}
.sticky-note{position:relative;background:var(--sage2);border-radius:22px;padding:22px 20px;transform:rotate(-1.2deg);box-shadow:0 3px 10px rgba(46,43,37,.14)}
.sticky-note p{margin:0;font-size:14px;color:var(--sage8);text-wrap:pretty}
.notebook{position:relative;background-color:var(--paper);background-image:var(--lined);border-radius:30px;box-shadow:0 3px 10px rgba(46,43,37,.14)}
.holes{position:absolute;left:16px;top:24px;bottom:24px;width:16px;background:var(--holes);pointer-events:none}

/* P.01 overview */
.ov-hotels{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin:-8px 0 22px}
.ov-hotels span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:34px 26px;padding-top:8px}
.ov-card{position:relative;text-align:left;border:0;cursor:pointer;background:var(--paper);border-radius:28px;padding:24px 22px 18px;box-shadow:var(--sh-md);transform:rotate(var(--tilt));transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:10px}
.ov-card:hover{transform:rotate(0) translateY(-6px);box-shadow:var(--sh-lg)}
.ov-card .tp{position:absolute;top:-11px;left:28px;width:84px;height:22px;border-radius:3px;background:var(--c);opacity:.5;transform:rotate(-3deg)}
.ov-date{position:absolute;right:16px;top:16px;width:46px;height:54px;border-radius:8px;border:2px dashed var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transform:rotate(4deg)}
.ov-date b{font-family:'Caprasimo',serif;font-weight:400;font-size:17px}.ov-date small{font-size:10px;color:var(--mute)}
.ov-day{font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.14em;color:var(--acc7)}
.ov-title{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:21px;line-height:1.25;text-wrap:balance;padding-right:56px}
.cpills{display:flex;flex-wrap:wrap;gap:6px}
.cpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px 2px 7px;border-radius:999px;white-space:nowrap;background:var(--surface)}
.ov-hl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute2)}
.ov-hl div{display:flex;gap:8px}.ov-hl span:first-child{color:var(--mute);font-variant-numeric:tabular-nums;width:40px;flex:none}
.ov-hl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed rgba(32,30,29,.12);padding-top:10px;margin-top:auto;font-size:13px}
.ov-foot b{font-weight:700}.ov-foot span:last-child{font-weight:700;color:var(--acc7);white-space:nowrap}

/* P.02 itinerary */
.chipwrap{position:relative;margin:0 -4px 14px}
.daychips{display:flex;gap:12px;overflow-x:auto;padding:14px 4px 10px;margin:0;scrollbar-width:none;scroll-behavior:smooth}
.daychips::-webkit-scrollbar{display:none}
/* edges fade out while there is more to scroll */
.chipwrap.scrolls .daychips{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%)}
.chipwrap.scrolls.at-start .daychips{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%)}
.chipwrap.scrolls.at-end .daychips{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 100%)}
/* the route: a dashed flight path with a stop per day and a plane that follows the scroll */
.chiprail{padding:4px 22px 0}
.rail-track{position:relative;height:38px;cursor:pointer;touch-action:none}
.rail-line{position:absolute;left:0;right:0;top:12px;border-top:2px dashed rgba(32,30,29,.28)}
.rail-stop{position:absolute;top:0;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.rail-stop i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--c);margin-top:7px;transition:transform .2s}
.rail-stop em{font-style:normal;font-size:10px;font-weight:700;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail-stop:hover i{transform:scale(1.3)}
.rail-stop.on i{background:var(--c);transform:scale(1.35)}
.rail-stop.on em{color:var(--acc7)}
.rail-plane{position:absolute;top:-1px;transform:translateX(-50%) rotate(90deg);color:var(--acc);filter:drop-shadow(0 2px 2px rgba(46,43,37,.25));pointer-events:none;transition:left .12s linear}
@media (max-width:560px){.rail-stop em{display:none}.rail-track{height:28px}.chiprail{padding:2px 16px 0}}
/* phones: a day switcher that stays under the tabs while you read */
.daybar{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tabs-h,60px));z-index:25;align-items:center;gap:8px;margin:0 -20px 14px;padding:8px 14px;background:rgba(249,244,237,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--div);box-shadow:0 6px 14px -10px rgba(46,43,37,.35)}
@media (min-width:980px){.daybar{margin:0 0 18px;border:1px solid var(--div);border-radius:999px;padding:6px 10px;box-shadow:var(--sh-md)}.db-title{font-size:17px}.db-mid:hover .db-title{color:var(--acc7)}}
.db-hint{display:none;font-size:11px;color:var(--mute);white-space:nowrap}
@media (min-width:980px) and (hover:hover){.db-hint{display:inline}}
.db-arrow{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--div);background:var(--ground);font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.db-arrow.go{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.db-arrow:disabled{opacity:.3;cursor:default}
.db-mid{border:0;background:none;font:inherit;color:inherit;position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;padding:0 16px}
.db-day{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--acc7);white-space:nowrap}
.db-title{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:16px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-caret{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mute)}
.db-mid:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
.db-mid:hover .db-caret{color:var(--acc7)}
/* end of the day: go to the next one without scrolling back up */
.dayfoot{margin:26px 0 4px;display:flex;flex-direction:column;gap:12px}
.df-next{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;border-radius:22px;padding:16px 60px 16px 20px;background:var(--paper);box-shadow:var(--sh-md);cursor:pointer;border-left:8px solid var(--c);transition:transform .2s,box-shadow .2s}
.df-next:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.df-lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--acc7)}
.df-title{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:20px;line-height:1.3}
.df-go{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--paper);display:grid;place-items:center;font-size:18px}
.df-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.df-prev{border:0;background:none;color:var(--mute2);font-size:13px;cursor:pointer;padding:6px 4px;text-align:left}
.df-prev:hover{color:var(--acc7)}
.df-end{text-align:center;font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:18px;color:var(--acc7);padding:12px}
.dchip{position:relative;flex:none;min-width:108px;text-align:left;border:0;background:var(--paper);color:var(--ink);border-radius:20px;padding:12px 14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh-sm);transform:rotate(var(--tilt));transition:all .25s}
.dchip:hover{transform:rotate(0) translateY(-3px)}
.dchip[aria-pressed="true"]{background:var(--ink);color:#f5ead8;box-shadow:0 12px 32px rgba(46,43,37,.25);transform:none}
.dchip .tp{position:absolute;top:-8px;left:50%;margin-left:-22px;width:44px;height:16px;border-radius:2px;background:var(--c);opacity:.55;transform:rotate(-4deg)}
.dchip small{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.14em;opacity:.8}
.dchip b{font-family:'Caprasimo',serif;font-weight:400;font-size:22px;line-height:1.1}
.dchip .dots{display:flex;gap:4px;margin-top:2px}
.it-wrap{display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start}
.nb-page{flex:1 1 560px;min-width:0;border-radius:34px;padding:30px 26px 30px 54px}
.nb-page .holes{top:26px;bottom:26px}
.day-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.day-top .eyebrow{font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.14em;color:var(--acc7)}
.day-top h2{font-family:var(--disp);font-weight:700;font-synthesis:none;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:6px 0 10px}
.day-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.day-meta b{color:var(--ink)}
.day-nav{display:flex;gap:8px;flex:none}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--div);background:var(--ground);cursor:pointer;font-size:18px}
.rbtn:hover{background:var(--surface)}
.rbtn.go{border:0;background:var(--acc);color:var(--paper)}.rbtn.go:hover{background:var(--acc-h)}
.rbtn:disabled{opacity:.35;cursor:default}
.ev{display:grid;grid-template-columns:50px 18px minmax(0,1fr);column-gap:10px;--kc:var(--n6)}

async function shrinkImage(file){
  const bmp=await createImageBitmap(file).catch(()=>null);if(!bmp)throw new Error('读不了这张图片');
  const scale=Math.min(1,1280/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
  for(const q of [.82,.7,.55]){const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(b&&b.size<=1400000)return b}
  throw new Error('图片太大，压缩后还是超过 1.5MB');
}

/* ---------------- hotels we booked ourselves: details + room assignment ----------------
   trip.booked[city] = {n, addr, phone, cin, cout, ref, amt, cur, link, note, la, ln, prev,
                        rooms:[{no, type, who:[member id or name]}]}
   trip.settings.hotel[city] === 'booked' means the booked one is in use (itinerary, map, budget, booking list).
   Booked-ticks and paid prices are kept per hotel in trip.hotelMemo, so switching hotels never carries them over. */
const ROOM_TYPES={family:'亲子房',twin:'双床房',double:'大床房',triple:'三人房',other:'其他'};
const bookedOf=c=>{const b=(trip.booked||{})[c];return b&&b.n?b:null};
const isBooked=c=>trip.settings.hotel[c]==='booked'&&!!bookedOf(c);
const stayNights=c=>trip.days.filter(d=>d.stay===c);
// a Google Maps link carries "@lat,lng" or "?q=lat,lng"; anything else just isn't placed exactly
function parseLL(url){const s=String(url||'');const m=s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|query|ll|center)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/);return m?{la:+m[1],ln:+m[2]}:null}
function bookedHotel(c){const b=bookedOf(c);if(!b)return null;const ns=stayNights(c).length||1,a=PLACES[HOTEL_ANCHOR[c]]||{};
  const exact=b.la&&b.ln;return {id:'booked',booked:true,city:c,n:b.n,area:b.addr||'',la:exact?b.la:a.la,ln:exact?b.ln:a.ln,exact,rv:b.note||'我们自己订好的酒店。',
    perNight:+b.amt?cny(b.amt,b.cur)/ns:null}}
// who is in which room, for profiles and member cards
function roomOf(c,id){const b=bookedOf(c);if(!b||!id)return null;return (b.rooms||[]).find(r=>(r.who||[]).includes(id))||null}
function roomsOfMember(id){const o={};stayCities().forEach(c=>{const r=roomOf(c,id);if(r)o[c]=r});return o}
const whoName=x=>{const m=(typeof CLOUD!=='undefined'&&CLOUD.on)?CLOUD.members.find(z=>z.email===x):null;return m?m.name:String(x)};
const meId=()=>(typeof CLOUD!=='undefined'&&CLOUD.on&&CLOUD.me)?CLOUD.me.email:null;

// move the booked tick / paid price of the hotel we leave into the memo, bring back the new one's
function swapHotel(t,c,to){const from=t.settings.hotel[c];if(from===to)return;const k='hotel-'+c;
  t.hotelMemo=t.hotelMemo||{};const memo=t.hotelMemo[c]=t.hotelMemo[c]||{};
  memo[from]={b:t.bookings[k]||null,by:(t.bookedBy||{})[k]||null,a:(t.actual||{})[k]||null,who:(t.assign||{})[k]||null};
  const r=memo[to]||{};delete memo[to];
  delete t.bookings[k];if(t.bookedBy)delete t.bookedBy[k];if(t.actual)delete t.actual[k];if(t.assign)delete t.assign[k];
  if(r.b)t.bookings[k]=r.b;if(r.by)(t.bookedBy=t.bookedBy||{})[k]=r.by;if(r.a)(t.actual=t.actual||{})[k]=r.a;if(r.who)(t.assign=t.assign||{})[k]=r.who;
  t.settings.hotel[c]=to}

function commit(fn,msg,log){
  if(viewerOnly()){toast('你只有查看权限，改不了。需要编辑请找管理员');render();return}
  fn(trip);trip.rev=Math.random().toString(36).slice(2);trip.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(trip))}catch(e){}
  if(CLOUD.on&&CLOUD.me){cloudQueue.push({fn,log:log===undefined?msg:log});cloudPump()}

}
const cloudQueue=[];let cloudBusy=false;
async function flush(){

  catch(e){const c=e&&e.code;if(c==='unavailable'){dirty=true;setTimeout(flush,1200+Math.random()*1200)}else if(c==='invalid_argument'){readOnly=true;setSync('readonly')}else setSync('err')}

(async()=>{try{

    if(snap.metadata&&snap.metadata.hasPendingWrites)return;if(!snap.exists)return;
    const d=snap.data();if(!d||!Array.isArray(d.days)||d.rev===trip.rev)return;
    trip=norm(clone(d));try{localStorage.setItem(LS,JSON.stringify(trip))}catch(e){}
    if(S.day>=trip.days.length)S.day=0;
    if(S.edit)pending=true;else{render();toast('行程已更新（来自同行者）')}

}catch(e){}})();

const MX=ln=>(ln-113.2)*COS*1000,MY=la=>(23.3-la)*1000;
function mapPoints(scope){
  let pts=[],route=[];
  if(scope==='all'){const seen={};trip.days.forEach(d=>d.items.forEach(i=>{const p=place(i.place);if(p&&!seen[p.id]){seen[p.id]=1;pts.push({...p,label:''})}}))}

  return {pts,route};
}
function fitVB(xy){if(!xy.length)return {x:0,y:0,w:1154,h:1500};const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const w=Math.max(x1-x0,30),h=Math.max(y1-y0,30),pd=Math.max(w,h)*.22+12;return {x:(x0+x1)/2-w/2-pd,y:(y0+y1)/2-h/2-pd,w:w+pd*2,h:h+pd*2}}
function mapSVG(key,scope){
  const {pts,route}=mapPoints(scope);const vk=key+'|'+scope;
  const vb=S.views[vk]||fitVB(pts.map(p=>[MX(p.ln),MY(p.la)]));
  const r=Math.max(vb.w,vb.h)*.017;
  const poly=a=>'M'+a.map(p=>MX(p[0]).toFixed(1)+','+MY(p[1]).toFixed(1)).join('L');
  let len=0;for(let k=1;k<route.length;k++)len+=Math.hypot(MX(route[k].ln)-MX(route[k-1].ln),MY(route[k].la)-MY(route[k-1].la));
  const rd=route.length>1?'M'+route.map(p=>MX(p.ln).toFixed(1)+','+MY(p.la).toFixed(1)).join('L'):'';
  let s=`<rect x="-3000" y="-3000" width="8000" height="8000" fill="#efe3cc"/>`;
  s+=`<path d="${poly(WATER)}Z" fill="#c9d8cf" stroke="#aebfb3" stroke-width="${(r*.14).toFixed(2)}"/>`;
  ISLANDS.forEach(i=>s+=`<path d="${poly(i)}Z" fill="#efe3cc" stroke="#aebfb3" stroke-width="${(r*.14).toFixed(2)}"/>`);
  s+=`<path d="${poly(RIVER)}" fill="none" stroke="#c9d8cf" stroke-width="${(r*.7).toFixed(2)}" stroke-linecap="round"/>`;
  Object.keys(CITY_LABEL).forEach(c=>s+=`<text x="${MX(CITY_LABEL[c][0])}" y="${MY(CITY_LABEL[c][1])}" font-size="${(r*2.2).toFixed(1)}" fill="rgba(32,30,29,.3)" font-family="'Noto Serif SC',serif" font-weight="700" text-anchor="middle">${CITY[c].n}</text>`);
  if(rd){s+=`<path d="${rd}" fill="none" stroke="#201e1d" stroke-width="${(r*.26).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:${len.toFixed(1)};stroke-dashoffset:${len.toFixed(1)};animation:tpDraw 1.8s cubic-bezier(.4,.1,.3,1) forwards"/>`;
    s+=`<circle r="${(r*.5).toFixed(2)}" fill="#c67139" stroke="#f9f4ed" stroke-width="${(r*.15).toFixed(2)}"><animateMotion dur="${Math.max(5,route.length*.9)}s" repeatCount="indefinite" path="${rd}"/></circle>`}
  pts.forEach(p=>{const sel=S.pick===p.id,rr=r*(sel?1.35:1)*(scope==='all'?.7:1),x=MX(p.ln),y=MY(p.la);
    s+=`<g class="mk" data-pid="${esc(p.id)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><title>${esc(p.n)}</title>`;
    if(sel)s+=`<circle r="${(rr*1.6).toFixed(2)}" fill="rgba(198,113,57,.25)"/>`;
    s+=`<circle r="${rr.toFixed(2)}" fill="${p.hotel?'#201e1d':(CC[p.c]||'#645c50')}" stroke="#f9f4ed" stroke-width="${(rr*.22).toFixed(2)}"/>`;
    if(p.label)s+=`<text font-size="${(rr*(p.label.length>2?.8:1.05)).toFixed(2)}" fill="#f9f4ed" font-weight="700" text-anchor="middle" dy=".35em" font-family="Figtree,sans-serif">${esc(p.label)}</text>`;
    if(scope!=='all'||sel)s+=`<text y="${(rr*2.3).toFixed(2)}" font-size="${(r*.9).toFixed(2)}" fill="#201e1d" text-anchor="middle" font-weight="600" stroke="#f9f4ed" stroke-width="${(r*.3).toFixed(2)}" paint-order="stroke" font-family="'Noto Sans SC',sans-serif">${esc(short(p.n).slice(0,10))}</text>`;
    s+=`</g>`});
  return {svg:`<svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet">${s}</svg>`,vb};
}

let mapDrag=null,mapMoved=false;

addEventListener('pointermove',e=>{if(!mapDrag)return;const dx=e.clientX-mapDrag.sx,dy=e.clientY-mapDrag.sy;if(Math.abs(dx)+Math.abs(dy)>4)mapMoved=true;if(!mapMoved)return;const v=mapDrag.vb,nv={x:v.x-dx*mapDrag.sc,y:v.y-dy*mapDrag.sc,w:v.w,h:v.h};mapDrag.svg.setAttribute('viewBox',`${nv.x} ${nv.y} ${nv.w} ${nv.h}`);S.views[mapDrag.el.dataset.map]=nv});

/* ---------- P.03 now ---------- */
function nowParts(){
  const t=nowTs(),tl=timeline();let ci=-1;tl.forEach((x,k)=>{if(x.ts<=t)ci=k});
  const ended=t>END+3600e3,cur=ci>=0&&!ended&&t>=START-3600e3?tl[ci]:null;
  const phase=ended?'旅程已经结束':t<START?'距离抵达广州':'旅途进行中 · 距离返程起飞';
  const cdt=t<START?START-t:Math.max(0,END-t);
  const boxes=[['天',Math.floor(cdt/864e5)],['时',Math.floor(cdt/36e5)%24],['分',Math.floor(cdt/6e4)%60],['秒',Math.floor(cdt/1e3)%60]];
  const fm=x=>{const p=place(x.i.place);return {when:dp(x.d.date).md+' '+fmtT(x.i.t),kind:KIND[x.i.kind],title:x.i.title,place:p?p.n:'',note:x.i.note}};
  const eta=ms=>{const m=Math.round(ms/6e4);if(m<1)return '马上';if(m<60)return m+' 分钟后';const h=Math.floor(m/60);if(h<24)return h+' 小时'+(m%60?' '+m%60+' 分':'')+'后';return Math.floor(h/24)+' 天后'};
  const next=tl.slice(ci+1,ci+7).map((x,k)=>({...fm(x),eta:eta(x.ts-t),first:k===0}));
  const clamp=Math.min(SHI,Math.max(SLO,t));
  return {t,phase,boxes,cur:cur?fm(cur):null,ended,next,clamp};
}
function nowDynamic(){const P=nowParts();
  return {
    cd:`<div class="eyebrow">${P.phase}</div><div class="sheets">${P.boxes.map(([l,v])=>`<div class="sheet"><div class="ring"><i></i><i></i></div><b>${pad(v)}</b><small>${l}</small></div>`).join('')}</div><div style="font-size:13px;color:var(--mute);margin-top:12px">北京时间 ${bj(P.t)}</div>`,
    lab:bj(P.clamp),
    days:trip.days.map((d,k)=>{const on=P.t>=TS(d.date,'00:00')&&P.t<TS(d.date,'24:00');return `<button type="button" data-a="simDay" data-v="${k}" aria-pressed="${on}">${dp(d.date).md}</button>`}).join(''),
    cur:`<div class="tape terra" style="top:-12px;left:50%;margin-left:-46px;transform:rotate(2deg)"></div><div class="live"><i></i>正在进行</div>`+(P.cur?`<div style="margin-top:12px"><div style="font-size:13px">${esc(P.cur.when)} · ${esc(P.cur.kind)}</div><div class="t">${esc(P.cur.title)}</div><div style="font-size:13px">${esc(P.cur.place)}</div>${P.cur.note?`<p style="margin:8px 0 0;font-size:13px">${esc(P.cur.note)}</p>`:''}</div>`:`<p style="margin:12px 0 0">${P.ended?'欢迎回家，记得把照片整理出来。':'旅程还没开始。拖动上面的时间条，可以预览旅途中任何一刻。'}</p>`),
    next:`<div class="eyebrow">接下来</div><div style="display:flex;flex-direction:column;margin-top:8px">${P.next.map(x=>`<div class="nx${x.first?' first':''}"><i></i><span class="w">${esc(x.when)}</span><span class="tt">${esc(x.title)}</span><span class="e">${x.eta}</span></div>`).join('')||'<p class="ph-note">没有更多安排了。</p>'}</div>`,

// route stamps on the overview: a stop per city we sleep in, plus day trips (a day spent in another city than the one we sleep in)
function routeSegs(){const out=[];const nights=c=>trip.days.filter(d=>d.stay===c).length;
  trip.days.forEach((d,k)=>{let key,c,label,sub;
    if(/长隆/.test(d.title)){c=d.cities[0];key='CL';label='长隆';sub='一日'}
    else if(/一日游/.test(d.title)||(d.stay&&d.cities&&d.cities[0]&&d.cities[0]!==d.stay)){c=d.cities[0];key='trip:'+c;label=CITY[c].n;sub=dp(d.date).md+' 一日游'}
    else if(d.stay){c=d.stay;key='stay:'+c;label=CITY[c].n;sub='住'+nights(c)+'晚';if(out.some(o=>o.key===key))return}
    else return;
    const last=out[out.length-1];if(last&&last.key===key)return;
    out.push({key,c,label,sub,k:k===0&&trip.days.length>1?1:k})});
  return out.map(x=>[x.c,x.label,x.sub,x.k])}

const tkSale=t=>{const p=dp(t.date).dt;if(/12306/.test(t.how)){const d=new Date(p);d.setDate(d.getDate()-14);return d.getTime()}return p.getTime()};
const tkWhen=t=>dp(t.date).dt.getTime()+tMin(t.t||'0:0')*6e4;

const fmtS=(s,v)=>s.dec?(+v).toFixed(s.dec):String(Math.round(v));

/* ---------- saving with conflict replay ---------- */
function planForServer(){const t=clone(trip);delete t.rev;delete t.updatedAt;return t}
async function cloudPump(){
  if(cloudBusy||!cloudQueue.length)return;cloudBusy=true;setSync('saving');
  const batch=cloudQueue.splice(0,cloudQueue.length);
  const r=await api('/plan',{method:'PUT',body:{data:planForServer(),baseRev:CLOUD.rev,log:batch.map(b=>b.log).filter(Boolean)}});
  if(r.status===409&&r.body.conflict){
    // someone saved first: take their version, replay our edits on top, try again
    const fresh=norm(r.body.data||clone(DEFAULT));batch.forEach(b=>{try{b.fn(fresh)}catch(e){}});
    trip=fresh;CLOUD.rev=r.body.rev;cloudQueue.unshift(...batch);cloudBusy=false;
    if(!S.edit)render();return cloudPump();
  }
  if(!r.ok){cloudQueue.unshift(...batch);cloudBusy=false;setSync('cloudErr');setTimeout(cloudPump,4000);return}
  CLOUD.rev=r.body.rev;cloudBusy=false;setSync('cloud');
  if(cloudQueue.length)cloudPump();else refreshLog();
}
async function refreshLog(){const r=await api('/log');if(r.ok){CLOUD.log=r.body.log||[];if(S.tab==='team')render()}}
async function refreshMembers(){const r=await api('/members');if(r.ok){CLOUD.members=r.body.members||[];const me=CLOUD.members.find(m=>m.email===CLOUD.email);if(me)CLOUD.me=me}}
async function refreshExpenses(){const r=await api('/expenses');if(r.ok)CLOUD.expenses=r.body.expenses||[]}
async function loadPlan(){const r=await api('/plan');if(!r.ok)return;if(r.body.data){trip=norm(r.body.data);CLOUD.rev=r.body.rev}else CLOUD.rev=0;try{localStorage.setItem(LS,JSON.stringify(trip))}catch(e){}}
async function poll(){
  if(!CLOUD.on||!CLOUD.me||document.hidden)return;
  const r=await api('/poll');if(!r.ok){setSync('cloudErr');return}
  const v=r.body,old=CLOUD.ver;CLOUD.ver=v;let changed=false;
  if(v.rev!==CLOUD.rev&&!cloudBusy&&!cloudQueue.length){await loadPlan();changed=true;toast('行程已更新（来自同伴）')}
  if(v.members!==old.members){await refreshMembers();changed=true}
  if(v.expenses!==old.expenses){await refreshExpenses();changed=true}
  if(v.log!==old.log)await refreshLog();
  if(!cloudBusy)setSync('cloud');
  if(changed){if(S.edit)pending=true;else render()}
}

/* ---------- boot ---------- */
var joinCode=(()=>{try{return (new URLSearchParams(location.search).get('join')||'').trim().toUpperCase()}catch(e){return ''}})();
async function cloudBoot(){
  const r=await api('/me');
  if(!r.json)return; // not on Cloudflare: keep GitHub Pages / claude.ai behaviour
  CLOUD.on=true;
  if(r.status===401){CLOUD.me=null;CLOUD.firstUser=!!r.body.firstUser;cloudUI.auth=cloudUI.auth||(CLOUD.firstUser||joinCode?'register':'login');renderOnboard();render();return}
  if(!r.ok){CLOUD.err=r.body.error||'服务器出错了';renderOnboard();return}
  CLOUD.err='';CLOUD.email=r.body.email;CLOUD.me=r.body.member;cloudUI.auth=null;
  if(joinCode){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}joinCode=''}
  await Promise.all([refreshMembers(),refreshExpenses(),refreshLog(),loadPlan(),refreshInvite(),refreshSettings()]);
  // the very first account uploads the plan everyone starts from
  if(CLOUD.rev===0){cloudQueue.push({fn:()=>{},log:'建立了共享行程'});cloudPump()}
  const p=await api('/poll');if(p.ok)CLOUD.ver=p.body;
  setSync('cloud');renderOnboard();render();
  if(!cloudUI.polling){cloudUI.polling=true;setInterval(poll,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}
}

/* ---------- P.11 expenses ---------- */
function toMYR(a,cur){const s=trip.settings,myr=+s.myr||.59;if(cur==='MYR')return a;if(cur==='CNY')return a*myr;return a*(s.rates[cur]||1)*myr}
function balances(){const net={};CLOUD.members.forEach(m=>net[m.email]=0);let total=0;
  CLOUD.expenses.forEach(e=>{const v=toMYR(+e.amount,e.cur);total+=v;const sp=(e.split||[]).filter(x=>x in net);if(!sp.length||!(e.payer in net))return;net[e.payer]+=v;sp.forEach(x=>net[x]-=v/sp.length)});
  const cr=Object.entries(net).filter(([,v])=>v>.5).map(([e,v])=>({e,v})).sort((a,b)=>b.v-a.v),db=Object.entries(net).filter(([,v])=>v<-.5).map(([e,v])=>({e,v:-v})).sort((a,b)=>b.v-a.v);
  const moves=[];let i=0,j=0;while(i<db.length&&j<cr.length){const x=Math.min(db[i].v,cr[j].v);moves.push({from:db[i].e,to:cr[j].e,v:x});db[i].v-=x;cr[j].v-=x;if(db[i].v<.5)i++;if(cr[j].v<.5)j++}
  return {net,moves,total}}

  const bal=CLOUD.members.map(m=>{const v=B.net[m.email]||0;return `<div class="brow">${avatar(m,28)}<span class="bn">${esc(m.name)}</span><b class="tab-num ${v>.5?'pos':v<-.5?'neg':''}">${v>.5?'应收 ':v<-.5?'应付 ':''}RM ${n0(Math.abs(v))}</b></div>`}).join('');
  const moves=B.moves.length?B.moves.map(x=>`<div class="mv">${avatar(CLOUD.members.find(m=>m.email===x.from),24)}<b>${esc(memberName(x.from))}</b><span>转给</span>${avatar(CLOUD.members.find(m=>m.email===x.to),24)}<b>${esc(memberName(x.to))}</b><em class="tab-num">RM ${n0(x.v)}</em></div>`).join(''):'<p class="ph-note">目前大家都不欠钱。</p>';
  const list=CLOUD.expenses.map(e=>{const sym=(EXP_CURS.find(c=>c[0]===e.cur)||['',''])[1];const armed=cloudUI.expDel===e.id;
    return `<div class="erow">${avatar(CLOUD.members.find(m=>m.email===e.payer),30)}<div class="em"><b>${esc(e.descr)}</b><small>${esc(memberName(e.payer))} 付 · ${esc(e.day.slice(5).replace('-','/'))} · ${e.split.length} 人分（${e.split.map(x=>esc(memberName(x))).join('、')}）</small></div>
      <div class="ea"><b class="tab-num">${sym}${(+e.amount).toLocaleString('en-US',{maximumFractionDigits:2})}</b>${e.cur!=='MYR'?`<small>≈ RM ${n0(toMYR(+e.amount,e.cur))}</small>`:''}</div>
      <button type="button" class="mini-btn${armed?' armed':''}" data-a="cl-expDel" data-v="${e.id}">${armed?'确定删除？':'删除'}</button></div>`}).join('')||'<p class="ph-note" style="padding:12px 0">还没有记账。旅途中谁先付了钱，就在上面记一笔。</p>';
  return `<section class="page" style="display:flex;flex-direction:column;gap:30px">${ph('P.11','分账','谁先付了钱就记一笔，最后按马币算清楚谁要转多少给谁。汇率跟「预算」里的设置一样。')}
    <div class="split-top">${form}
      <div class="split-side"><div class="receipt"><div class="rc-h">GBA TRIP · 分账</div>
        <div class="rc-tot"><div><small>一共花了</small><div class="big">RM ${n0(B.total)}</div><div class="sub">${CLOUD.expenses.length} 笔</div></div><div><small>平均每人</small><div class="mid">RM ${n0(B.total/Math.max(1,CLOUD.members.length))}</div></div></div>
        <div class="bals">${bal}</div></div>
        <div class="sticky-note settle"><div class="tape terra" style="top:-10px;left:50%;margin-left:-46px"></div><h3 class="disp" style="margin:0 0 10px;font-size:20px">怎么还最省事</h3>${moves}</div></div></div>
    <div><div class="tk-gh"><h3>账本</h3><span>按日期，最新的在上面</span></div><div class="notebook elist"><div class="holes"></div>${list}</div></div></section>`;
}

/* ---------- P.12 accounts & roles ---------- */
async function refreshSettings(){const r=await api('/settings');if(r.ok)CLOUD.defaultRole=r.body.defaultRole}
// which roles the signed-in person may give a target: the super admin sets anything, admins only switch editor/viewer
function roleOptions(actor,target){
  if(actor==='super')return ['admin','editor','viewer','super'];
  if(actor==='admin'&&(target==='editor'||target==='viewer'))return ['editor','viewer'];
  return [];
}
function pAccounts(){
  const me=CLOUD.me||{},sup=me.role==='super';
  if(!me.isAdmin)return pTeam();
  const counts=['super','admin','editor','viewer'].map(r=>[r,CLOUD.members.filter(m=>(m.role||'editor')===r).length]);
  const rows=CLOUD.members.map(m=>{const mine=m.email===CLOUD.email,role=m.role||'editor',opts=mine?[]:roleOptions(me.role,role),t=cloudUI.transfer===m.email;
    const sel=opts.length?`<select data-role="${esc(m.email)}" aria-label="${esc(m.name)} 的角色">${opts.map(r=>`<option value="${r}"${r===role?' selected':''}>${r==='super'?'转让超级管理员给他':ROLE_NAME[r]}</option>`).join('')}</select>`:`<span class="badge role-${role}">${ROLE_NAME[role]}</span>`;
    const can=!mine&&(sup||(me.role==='admin'&&(role==='editor'||role==='viewer')));
    return `<div class="acc${mine?' me':''}">${avatar(m,36)}<div class="an"><b>${esc(m.name)}${mine?' <span class="badge you">你</span>':''}${m.locked?' <span class="badge lock">已锁定</span>':''}</b><small class="tab-num">${esc(m.phone)} · 最近登录 ${m.lastLogin?bj(m.lastLogin):'—'}</small></div>
      <div class="ar">${sel}</div>
      <div class="aa">${can?`<button type="button" class="mini-btn" data-a="cl-reset" data-v="${esc(m.email)}">重设密码</button><button type="button" class="mini-btn" data-a="cl-kick" data-v="${esc(m.email)}">全部登出</button><button type="button" class="mini-btn${cloudUI.rmArm===m.email?' armed':''}" data-a="cl-rm" data-v="${esc(m.email)}">${cloudUI.rmArm===m.email?'确定移除？':'移除'}</button>`:''}</div>
      ${t?`<div class="confirm">确定把<b>超级管理员</b>转给 ${esc(m.name)}？转让后你会变成「管理员」，不能再设管理员。<button type="button" class="btn" data-a="cl-transfer" data-v="${esc(m.email)}">确定转让</button><button type="button" class="btn ghost" data-a="cl-transferNo">取消</button></div>`:''}
      ${cloudUI.temp&&cloudUI.temp.id===m.email?`<p class="ferr temp">临时密码：<b class="tab-num">${esc(cloudUI.temp.pw)}</b>　发给 ${esc(m.name)}，登录后请他在「编辑我的资料」改密码。</p>`:''}</div>`}).join('');
  return `<section class="page" style="display:flex;flex-direction:column;gap:30px">${ph('P.12','账号与权限',sup?'你是超级管理员：这里集中管理所有账号和角色。':'你是管理员：可以管理「可编辑」和「只能查看」的同伴。')}
    <div class="role-grid">${counts.map(([r,n])=>`<div class="role-card role-${r}"><b>${n}</b><span>${ROLE_NAME[r]}</span><small>${ROLE_DESC[r]}</small></div>`).join('')}</div>
    <div class="acc-set">
      <div class="sticky-note"><div class="tape terra" style="top:-10px;right:40px;transform:rotate(4deg)"></div><p><b>新成员注册后默认是：</b></p>
        ${sup?`<div class="seg" role="group" aria-label="新成员默认权限" style="margin-top:8px"><button type="button" data-a="cl-defRole" data-v="editor" aria-pressed="${CLOUD.defaultRole!=='viewer'}">可编辑</button><button type="button" data-a="cl-defRole" data-v="viewer" aria-pressed="${CLOUD.defaultRole==='viewer'}">只能查看</button></div>`:`<p style="margin-top:6px"><b>${CLOUD.defaultRole==='viewer'?'只能查看':'可编辑'}</b>（只有超级管理员可以改）</p>`}</div>
      ${CLOUD.invite?`<div class="sticky-note invite" style="transform:rotate(.6deg)"><p><b>邀请链接</b></p><div class="inv"><code class="tab-num">${esc(inviteLink())}</code><button type="button" class="btn" data-a="cl-copyInvite">复制</button><button type="button" class="btn ghost" data-a="cl-newInvite">换一个</button></div></div>`:''}
    </div>
    <div><div class="tk-gh"><h3>所有账号</h3><span>${CLOUD.members.length} 个 · 改角色马上生效</span></div><div class="notebook acc-list"><div class="holes"></div>${rows}</div></div></section>`;
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id==='me-form'){e.preventDefault();saveProfile(e.target);return}
  if(e.target.id==='reg-form'||e.target.id==='login-form'){e.preventDefault();doAuth(e.target,e.target.id==='reg-form'?'register':'login');return}
  if(e.target.id==='exp-form'){e.preventDefault();const f=new FormData(e.target);
    const body={descr:f.get('descr'),amount:+f.get('amount'),cur:f.get('cur'),payer:f.get('payer'),day:f.get('day'),split:f.getAll('split')};
    const r=await api('/expenses',{method:'POST',body});
    if(!r.ok){cloudUI.expErr=r.body.error||'记账失败';render();return}
    cloudUI.expErr='';await refreshExpenses();refreshLog();render();toast('已记一笔')}
});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a^="cl-"]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='cl-editMe'){cloudUI.editMe=true;render();scrollTo({top:$('.tabs').offsetTop,behavior:'smooth'})}
  if(a==='cl-cancelMe'){cloudUI.editMe=false;cloudUI.obErr='';render()}
  if(a==='cl-copy'){try{await navigator.clipboard.writeText(v);toast('已复制 '+v)}catch(err){toast(v)}}
  if(a==='cl-rm'){if(cloudUI.rmArm!==v){cloudUI.rmArm=v;render();setTimeout(()=>{if(cloudUI.rmArm===v){cloudUI.rmArm=null;render()}},3000);return}
    cloudUI.rmArm=null;const r=await api('/members/'+encodeURIComponent(v),{method:'DELETE'});if(!r.ok){toast(r.body.error||'移除失败');return}await refreshMembers();refreshLog();render();toast('已移除')}
  if(a==='cl-transferNo'){cloudUI.transfer=null;render()}
  if(a==='cl-transfer'){cloudUI.transfer=null;const r=await api('/members/'+encodeURIComponent(v)+'/role',{method:'PUT',body:{role:'super'}});if(!r.ok){toast(r.body.error||'转让失败');return}await refreshMembers();refreshLog();render();toast('已转让超级管理员')}
  if(a==='cl-kick'){const r=await api('/members/'+encodeURIComponent(v)+'/logout',{method:'POST'});toast(r.ok?'已让对方在所有设备登出':(r.body.error||'失败'));refreshLog()}
  if(a==='cl-defRole'){const r=await api('/settings',{method:'PUT',body:{defaultRole:v}});if(r.ok){CLOUD.defaultRole=r.body.defaultRole;render();toast('新成员默认：'+ROLE_NAME[v])}else toast(r.body.error||'改不了')}
  if(a==='cl-auth'){cloudUI.auth=v;cloudUI.obErr='';renderOnboard()}
  if(a==='cl-retry'){CLOUD.err='';cloudBoot()}
  if(a==='cl-logout'){await api('/auth/logout',{method:'POST'});CLOUD.me=null;CLOUD.members=[];CLOUD.expenses=[];CLOUD.log=[];cloudUI.auth='login';S.tab='overview';await cloudBoot();toast('已登出')}
  if(a==='cl-reset'){const r=await api('/members/'+encodeURIComponent(v)+'/reset',{method:'POST'});if(!r.ok){toast(r.body.error||'重设失败');return}cloudUI.temp={id:v,pw:r.body.temp};refreshLog();render()}
  if(a==='cl-copyInvite'){const l=inviteLink();try{await navigator.clipboard.writeText(l);toast('已复制邀请链接')}catch(err){toast(l)}}
  if(a==='cl-newInvite'){const r=await api('/invite',{method:'POST'});if(r.ok){CLOUD.invite=r.body.code;render();toast('已换新的邀请码，旧链接不能用了')}}
  if(a==='cl-expDel'){const id=+v;if(cloudUI.expDel!==id){cloudUI.expDel=id;render();setTimeout(()=>{if(cloudUI.expDel===id){cloudUI.expDel=null;render()}},3000);return}
    cloudUI.expDel=null;const r=await api('/expenses/'+id,{method:'DELETE'});if(!r.ok){toast(r.body.error||'删除失败');return}await refreshExpenses();refreshLog();render();toast('已删除')}
});
document.addEventListener('change',async e=>{const who=e.target.dataset&&e.target.dataset.role;if(!who)return;const role=e.target.value;
  if(role==='super'){cloudUI.transfer=who;render();return}
  const r=await api('/members/'+encodeURIComponent(who)+'/role',{method:'PUT',body:{role}});if(!r.ok){toast(r.body.error||'改不了');render();return}
  await refreshMembers();refreshLog();render();toast('已改成「'+ROLE_NAME[role]+'」')});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.assign;if(!id)return;const who=e.target.value,tt=(tickets().find(x=>x.id===id)||{}).title||id;
  commit(t=>{t.assign=t.assign||{};if(who)t.assign[id]=who;else delete t.assign[id]},who?'已分配给 '+memberName(who):'已取消分配',who?tt+' 交给 '+memberName(who)+' 订':'取消了 '+tt+' 的分配')});
document.addEventListener('click',e=>{if(e.target.closest('#me-chip')){S.tab='team';render();scrollTo({top:$('.tabs').offsetTop,behavior:'smooth'})}});
cloudBoot();

</script>
